name: Airlock safety checks

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: airlock-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          cache: npm
      - name: Verify pristine checkout before locked install
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - name: Install exactly from package-lock
        run: npm ci --ignore-scripts
      - run: npm run security:audit
      - run: npm run check
      - run: npm run demo
      - name: Generate bounded release evidence
        run: >-
          npm run release:evidence --
          --expected-commit "${{ github.sha }}"
          --output release-evidence/release.json
      - name: Retain release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: airlock-release-evidence
          path: release-evidence/release.json
          if-no-files-found: error
          retention-days: 14
      - name: Reject obvious committed secrets and private keys
        shell: bash
        run: |
          if git grep -nE \
            '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,})' \
            -- ':!SECURITY.md'; then
            echo "::error::Potential credential material found in tracked files."
            exit 1
          fi
      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/syft.tar.gz" \
            https://github.com/anchore/syft/releases/download/v1.40.1/syft_1.40.1_linux_amd64.tar.gz
          echo "c229137c919f22aa926c1c015388db5ec64e99c078e0baac053808e8f36e2e00  $RUNNER_TEMP/syft.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/syft.tar.gz" \
            --directory "$RUNNER_TEMP" syft
          "$RUNNER_TEMP/syft" dir:. --output cyclonedx-json=airlock.cdx.json
      - name: Retain SBOM evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: airlock-cyclonedx-sbom
          path: airlock.cdx.json
          if-no-files-found: error
          retention-days: 14
